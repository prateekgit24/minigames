<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fruit Cutter — Reflex Arena Standalone</title>
  <meta name="description" content="Slice fruit at peak height for max score. Avoid bombs and keep track of your lives.">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #080810;
      --bg2: #0f0e1a;
      --bg3: #16152a;
      --bg4: #1c1b33;
      --purple: #7c6fdd;
      --purple2: #a99ef5;
      --purple3: #3d3580;
      --green: #34d399;
      --red: #f87171;
      --amber: #fbbf24;
      --cyan: #22d3ee;
      --text: #e8e4ff;
      --text2: #9990cc;
      --text3: #4a4480;
      --border: #2a2840;
      --glow: rgba(124, 111, 221, 0.15);
    }
    body {
      font-family: 'Syne', sans-serif;
      background: var(--bg);
      background-image: 
        radial-gradient(at 0% 0%, rgba(124, 111, 221, 0.08) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(34, 211, 238, 0.05) 0px, transparent 50%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      overflow-x: hidden;
    }
    .game-container {
      width: 100%;
      max-width: 640px;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 2rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 50px var(--glow);
      position: relative;
      animation: fadeIn 0.4s ease-out;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1.25rem;
    }
    .back-btn {
      background: var(--bg3);
      border: 1px solid var(--border);
      color: var(--text2);
      padding: 8px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-family: 'Space Mono', monospace;
      font-size: 0.75rem;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .back-btn:hover {
      border-color: var(--purple);
      color: var(--purple2);
      box-shadow: 0 0 10px rgba(124, 111, 221, 0.2);
    }
    .title-wrap h1 {
      font-size: 1.5rem;
      font-weight: 900;
      letter-spacing: -1px;
      background: linear-gradient(135deg, var(--purple2), var(--cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .title-wrap p {
      font-size: 0.65rem;
      font-family: 'Space Mono', monospace;
      color: var(--text3);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 2px;
    }
    .stats-row {
      display: flex;
      gap: 12px;
      margin-bottom: 1.5rem;
    }
    .stat-box {
      flex: 1;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.75rem;
      text-align: center;
      transition: all 0.2s;
    }
    .stat-lbl {
      font-size: 0.6rem;
      font-family: 'Space Mono', monospace;
      color: var(--text3);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }
    .stat-val {
      font-size: 1.5rem;
      font-weight: 700;
      font-family: 'Space Mono', monospace;
      color: var(--purple2);
    }
    .game-area {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.5rem;
      min-height: 300px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .instr {
      font-size: 0.85rem;
      color: var(--text2);
      line-height: 1.6;
      margin-bottom: 1rem;
      font-family: 'Space Mono', monospace;
      max-width: 460px;
    }
    #fruitCanvas {
      background: #080810;
      border-radius: 12px;
      max-width: 100%;
      cursor: crosshair;
      border: 1px solid var(--border);
    }
    .big-btn {
      background: var(--purple3);
      border: 1px solid var(--purple);
      color: #fff;
      padding: 1rem 3rem;
      border-radius: 14px;
      font-family: 'Syne', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 15px rgba(124, 111, 221, 0.25);
    }
    .big-btn:hover {
      background: var(--purple);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(124, 111, 221, 0.4);
    }
    .big-btn:active {
      transform: scale(0.97);
    }
    .sm-btn {
      background: var(--bg4);
      border: 1px solid var(--border);
      color: var(--purple2);
      padding: 0.7rem 1.4rem;
      border-radius: 10px;
      cursor: pointer;
      font-family: 'Syne', sans-serif;
      font-size: 0.9rem;
      font-weight: 700;
      transition: all 0.15s;
    }
    .sm-btn:hover {
      border-color: var(--purple);
      background: var(--bg3);
      color: #fff;
    }
    .btn-row {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-top: 1.5rem;
    }
    .result-score {
      font-size: 4.5rem;
      font-weight: 900;
      color: var(--purple2);
      font-family: 'Space Mono', monospace;
      line-height: 1;
      margin-bottom: 8px;
      text-shadow: 0 0 20px rgba(124, 111, 221, 0.3);
    }
    .result-lbl {
      font-size: 0.75rem;
      color: var(--text3);
      font-family: 'Space Mono', monospace;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 1.25rem;
    }
    .result-sub {
      font-size: 0.95rem;
      color: var(--text2);
      margin-bottom: 0.5rem;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="game-container">
    <header class="header">
      <div class="title-wrap">
        <h1>Fruit Cutter</h1>
        <p>🍉 timing &amp; accuracy challenge</p>
      </div>
      <a href="index.html" class="back-btn">← Main Hub</a>
    </header>

    <div class="stats-row">
      <div class="stat-box">
        <div class="stat-lbl">Score</div>
        <div class="stat-val" id="gs-score">0</div>
      </div>
      <div class="stat-box">
        <div class="stat-lbl">Lives Left</div>
        <div class="stat-val" id="gs-round">❤️❤️❤️</div>
      </div>
      <div class="stat-box">
        <div class="stat-lbl">High Score</div>
        <div class="stat-val" id="gs-pb">—</div>
      </div>
    </div>

    <div class="game-area" id="gameArea">
      <div>
        <div class="instr">
          🔪 Slice fruit at its <strong>PEAK height</strong> (top of the arc) for +20pts bonus!<br>
          💣 Avoid bombs — slicing them ends the game instantly.<br>
          Miss 3 fruits = Game Over.
        </div>
        <canvas id="fruitCanvas" width="520" height="300"></canvas>
        <button class="big-btn" onclick="startFruit()" style="margin-top: 1.5rem">Begin Slicing</button>
      </div>
    </div>
  </div>

  <script>
    const FRUITS = ['🍉', '🍊', '🍋', '🍇', '🍓', '🍑', '🥭', '🍍'];
    let gameState = {
      score: 0,
      lives: 3,
      active: false,
      objects: [],
      animId: null,
      spawnTimers: []
    };

    function loadPB() {
      const pb = localStorage.getItem('pb_fruit_cutter') || '—';
      document.getElementById('gs-pb').textContent = pb + ' pts';
    }
    loadPB();

    // Setup canvas idle view
    function drawFruitIdle() {
      const cv = document.getElementById('fruitCanvas');
      if (!cv) return;
      const ctx = cv.getContext('2d');
      ctx.fillStyle = '#080810';
      ctx.fillRect(0, 0, cv.width, cv.height);
      ctx.fillStyle = '#2a2840';
      ctx.font = '3rem sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('🍉 🍊 💣 🍋', 260, 140);
      ctx.fillStyle = '#4a4480';
      ctx.font = '0.8rem Space Mono,monospace';
      ctx.fillText('Click/tap canvas during game to slice', 260, 190);
    }
    setTimeout(drawFruitIdle, 50);

    function startFruit() {
      // Clear existing anims & timers
      if (gameState.animId) cancelAnimationFrame(gameState.animId);
      gameState.spawnTimers.forEach(t => clearTimeout(t));
      gameState.spawnTimers = [];

      const area = document.getElementById('gameArea');
      area.innerHTML = `
        <canvas id="fruitCanvas" width="520" height="300"></canvas>
      `;

      const cv = document.getElementById('fruitCanvas');
      const ctx = cv.getContext('2d');

      gameState.active = true;
      gameState.objects = [];
      gameState.score = 0;
      gameState.lives = 3;

      document.getElementById('gs-score').textContent = '0';
      document.getElementById('gs-round').textContent = '❤️❤️❤️';

      cv.onclick = (e) => {
        if (!gameState.active) return;
        const rect = cv.getBoundingClientRect();
        const scaleX = cv.width / rect.width;
        const scaleY = cv.height / rect.height;
        const mx = (e.clientX - rect.left) * scaleX;
        const my = (e.clientY - rect.top) * scaleY;
        checkFruitClick(mx, my);
      };

      // Support Touch Slicing
      cv.ontouchstart = (e) => {
        e.preventDefault();
        if (!gameState.active) return;
        const rect = cv.getBoundingClientRect();
        const scaleX = cv.width / rect.width;
        const scaleY = cv.height / rect.height;
        const mx = (e.touches[0].clientX - rect.left) * scaleX;
        const my = (e.touches[0].clientY - rect.top) * scaleY;
        checkFruitClick(mx, my);
      };

      function spawnObj() {
        if (!gameState.active) return;
        const x = 50 + Math.random() * (cv.width - 100);
        const isBomb = Math.random() < 0.22;
        const vy = -(11 + Math.random() * 5.5);
        gameState.objects.push({
          x,
          y: cv.height + 30,
          vy,
          vx: (Math.random() - 0.5) * 1.6,
          emoji: isBomb ? '💣' : FRUITS[Math.floor(Math.random() * FRUITS.length)],
          isBomb,
          atPeak: false,
          peaked: false,
          size: 42,
          alpha: 1,
          sliced: false,
          sliceAnim: 0,
          missed: false
        });
        const nextSpawn = 800 + Math.random() * 800;
        const tid = setTimeout(spawnObj, nextSpawn);
        gameState.spawnTimers.push(tid);
      }
      const initialTid = setTimeout(spawnObj, 400);
      gameState.spawnTimers.push(initialTid);

      function loop() {
        if (!gameState.active) {
          ctx.fillStyle = '#080810';
          ctx.fillRect(0, 0, cv.width, cv.height);
          return;
        }

        ctx.fillStyle = '#080810';
        ctx.fillRect(0, 0, cv.width, cv.height);

        // Render objects
        for (let i = gameState.objects.length - 1; i >= 0; i--) {
          const o = gameState.objects[i];
          o.vy += 0.45; // gravity
          o.y += o.vy;
          o.x += o.vx;

          // Peak height detection
          if (!o.peaked && o.vy > 0 && !o.atPeak) {
            o.atPeak = true;
          }
          if (o.atPeak && o.vy > 2.0) {
            o.peaked = true;
            o.atPeak = false;
          }

          // Slice fade out animation
          if (o.sliced) {
            o.sliceAnim++;
            o.alpha -= 0.07;
            if (o.alpha <= 0) {
              gameState.objects.splice(i, 1);
              continue;
            }
          }

          // Check missed fruits falling out of screen
          if (!o.sliced && !o.missed && o.y > cv.height + 50) {
            if (!o.isBomb) {
              gameState.lives--;
              updateFruitUI();
            }
            gameState.objects.splice(i, 1);
            if (gameState.lives <= 0 && !o.isBomb) {
              gameState.active = false;
              setTimeout(endFruit, 200);
            }
            continue;
          }

          // Draw object
          ctx.save();
          ctx.globalAlpha = o.alpha;
          ctx.font = `${o.size}px sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';

          // Peak hint indicators
          if (o.atPeak && !o.sliced && !o.isBomb) {
            ctx.beginPath();
            ctx.arc(o.x, o.y, 28, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(52, 211, 153, 0.7)';
            ctx.lineWidth = 3;
            ctx.stroke();
          }

          if (o.isBomb && !o.sliced) {
            ctx.beginPath();
            ctx.arc(o.x, o.y, 24, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(248, 113, 113, 0.5)';
            ctx.lineWidth = 2;
            ctx.stroke();
          }

          if (o.sliced) {
            // Draw split parts
            ctx.translate(o.x, o.y);
            ctx.rotate(o.sliceAnim * 0.15);
            ctx.fillText(o.emoji, 0, 0);
          } else {
            ctx.fillText(o.emoji, o.x, o.y);
          }
          ctx.restore();
        }

        gameState.animId = requestAnimationFrame(loop);
      }
      loop();
    }

    function checkFruitClick(mx, my) {
      for (let i = gameState.objects.length - 1; i >= 0; i--) {
        const o = gameState.objects[i];
        if (o.sliced) continue;
        const dx = mx - o.x;
        const dy = my - o.y;
        if (Math.sqrt(dx * dx + dy * dy) < o.size / 1.6) {
          if (o.isBomb) {
            gameState.active = false;
            setTimeout(endFruit, 200);
            return;
          }
          if (o.atPeak) {
            gameState.score += 20; // peak hit bonus
          } else {
            gameState.score += 5;
          }
          o.sliced = true;
          updateFruitUI();
          return;
        }
      }
    }

    function updateFruitUI() {
      document.getElementById('gs-score').textContent = gameState.score;
      document.getElementById('gs-round').textContent = '❤️'.repeat(Math.max(0, gameState.lives)) + '🖤'.repeat(3 - Math.max(0, gameState.lives));
    }

    function endFruit() {
      if (gameState.animId) cancelAnimationFrame(gameState.animId);
      gameState.spawnTimers.forEach(t => clearTimeout(t));
      gameState.spawnTimers = [];

      const cv = document.getElementById('fruitCanvas');
      if (cv) {
        const ctx = cv.getContext('2d');
        ctx.fillStyle = 'rgba(8, 8, 16, 0.85)';
        ctx.fillRect(0, 0, cv.width, cv.height);
      }

      // Save high score
      const pb = localStorage.getItem('pb_fruit_cutter');
      if (!pb || gameState.score > parseInt(pb)) {
        localStorage.setItem('pb_fruit_cutter', gameState.score);
      }
      loadPB();

      const area = document.getElementById('gameArea');
      area.innerHTML = `
        <div class="fade-in" style="text-align: center; width: 100%;">
          <div class="result-score">${gameState.score}</div>
          <div class="result-lbl">points scored</div>
          <div class="result-sub" style="margin-bottom: 1.5rem;">
            Diced fruits with absolute precision.<br>
            Peak height hits = <strong>20pts</strong> · Normal slices = <strong>5pts</strong>
          </div>
          <div class="btn-row">
            <button class="sm-btn" onclick="resetGame()">Play Again</button>
            <a href="reflex_arena.html" class="sm-btn">Reflex Arena</a>
          </div>
        </div>
      `;
    }

    function resetGame() {
      const area = document.getElementById('gameArea');
      area.innerHTML = `
        <div>
          <div class="instr">
            🔪 Slice fruit at its <strong>PEAK height</strong> (top of the arc) for +20pts bonus!<br>
            💣 Avoid bombs — slicing them ends the game instantly.<br>
            Miss 3 fruits = Game Over.
          </div>
          <canvas id="fruitCanvas" width="520" height="300"></canvas>
          <button class="big-btn" onclick="startFruit()" style="margin-top: 1.5rem">Begin Slicing</button>
        </div>
      `;
      document.getElementById('gs-score').textContent = '0';
      document.getElementById('gs-round').textContent = '❤️❤️❤️';
      drawFruitIdle();
    }
  </script>
</body>
</html>
