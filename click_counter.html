<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Click Counter — Reflex Arena Standalone</title>
  <meta name="description" content="Test your finger clicking speed. Get the maximum possible clicks in a 10 or 20 second sprint.">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #080810;
      --bg2: #0f0e1a;
      --bg3: #16152a;
      --bg4: #1c1b33;
      --purple: #7c6fdd;
      --purple2: #a99ef5;
      --purple3: #3d3580;
      --green: #34d399;
      --red: #f87171;
      --amber: #fbbf24;
      --cyan: #22d3ee;
      --text: #e8e4ff;
      --text2: #9990cc;
      --text3: #4a4480;
      --border: #2a2840;
      --glow: rgba(124, 111, 221, 0.15);
    }
    body {
      font-family: 'Syne', sans-serif;
      background: var(--bg);
      background-image: 
        radial-gradient(at 0% 0%, rgba(124, 111, 221, 0.08) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(34, 211, 238, 0.05) 0px, transparent 50%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      overflow-x: hidden;
    }
    .game-container {
      width: 100%;
      max-width: 640px;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 2rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 50px var(--glow);
      position: relative;
      animation: fadeIn 0.4s ease-out;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1.25rem;
    }
    .back-btn {
      background: var(--bg3);
      border: 1px solid var(--border);
      color: var(--text2);
      padding: 8px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-family: 'Space Mono', monospace;
      font-size: 0.75rem;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .back-btn:hover {
      border-color: var(--purple);
      color: var(--purple2);
      box-shadow: 0 0 10px rgba(124, 111, 221, 0.2);
    }
    .title-wrap h1 {
      font-size: 1.5rem;
      font-weight: 900;
      letter-spacing: -1px;
      background: linear-gradient(135deg, var(--purple2), var(--cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .title-wrap p {
      font-size: 0.65rem;
      font-family: 'Space Mono', monospace;
      color: var(--text3);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 2px;
    }
    .stats-row {
      display: flex;
      gap: 12px;
      margin-bottom: 1rem;
    }
    .stat-box {
      flex: 1;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.75rem;
      text-align: center;
      transition: all 0.2s;
    }
    .stat-lbl {
      font-size: 0.6rem;
      font-family: 'Space Mono', monospace;
      color: var(--text3);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }
    .stat-val {
      font-size: 1.5rem;
      font-weight: 700;
      font-family: 'Space Mono', monospace;
      color: var(--purple2);
    }
    .timer-bar {
      width: 100%;
      height: 6px;
      background: var(--bg3);
      border-radius: 3px;
      margin-bottom: 1.5rem;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.02);
    }
    .timer-fill {
      height: 100%;
      background: var(--purple);
      border-radius: 3px;
      width: 100%;
      transition: width 0.1s linear, background 0.3s;
    }
    .game-area {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.5rem;
      min-height: 280px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .instr {
      font-size: 0.85rem;
      color: var(--text2);
      line-height: 1.6;
      margin-bottom: 1.5rem;
      font-family: 'Space Mono', monospace;
      max-width: 420px;
    }
    .big-btn {
      background: var(--purple3);
      border: 1px solid var(--purple);
      color: #fff;
      padding: 1rem 3rem;
      border-radius: 14px;
      font-family: 'Syne', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 15px rgba(124, 111, 221, 0.25);
    }
    .big-btn:hover {
      background: var(--purple);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(124, 111, 221, 0.4);
    }
    .big-btn:active {
      transform: scale(0.97);
    }
    .sm-btn {
      background: var(--bg4);
      border: 1px solid var(--border);
      color: var(--purple2);
      padding: 0.7rem 1.4rem;
      border-radius: 10px;
      cursor: pointer;
      font-family: 'Syne', sans-serif;
      font-size: 0.9rem;
      font-weight: 700;
      transition: all 0.15s;
    }
    .sm-btn:hover {
      border-color: var(--purple);
      background: var(--bg3);
      color: #fff;
    }
    .sm-btn.active {
      border-color: var(--purple);
      background: var(--purple3);
      color: #fff;
      box-shadow: 0 0 10px rgba(124, 111, 221, 0.2);
    }
    .btn-row {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-top: 1.5rem;
    }
    .click-zone {
      width: 100%;
      height: 250px;
      border-radius: 14px;
      background: var(--bg2);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      border: 2px dashed var(--border);
      transition: all 0.15s;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.4);
    }
    .click-zone:hover {
      border-color: rgba(124, 111, 221, 0.5);
      background: rgba(15, 14, 26, 0.8);
    }
    .click-zone:active {
      border-color: var(--purple);
      transform: scale(0.98);
      background: rgba(15, 14, 26, 0.6);
      box-shadow: 0 0 25px rgba(124, 111, 221, 0.1), inset 0 0 20px rgba(0,0,0,0.5);
    }
    .click-count {
      font-size: 6rem;
      font-weight: 900;
      font-family: 'Space Mono', monospace;
      color: var(--purple2);
      line-height: 1;
      text-shadow: 0 0 20px rgba(124, 111, 221, 0.25);
    }
    .result-score {
      font-size: 4.5rem;
      font-weight: 900;
      color: var(--purple2);
      font-family: 'Space Mono', monospace;
      line-height: 1;
      margin-bottom: 8px;
      text-shadow: 0 0 20px rgba(124, 111, 221, 0.3);
    }
    .result-lbl {
      font-size: 0.75rem;
      color: var(--text3);
      font-family: 'Space Mono', monospace;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 1.25rem;
    }
    .result-sub {
      font-size: 0.95rem;
      color: var(--text2);
      margin-bottom: 0.5rem;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="game-container">
    <header class="header">
      <div class="title-wrap">
        <h1>Click Counter</h1>
        <p>🖱️ speed clicking sprint</p>
      </div>
      <a href="index.html" class="back-btn">← Main Hub</a>
    </header>

    <div class="stats-row">
      <div class="stat-box">
        <div class="stat-lbl">Clicks</div>
        <div class="stat-val" id="gs-score">0</div>
      </div>
      <div class="stat-box">
        <div class="stat-lbl">Time Left</div>
        <div class="stat-val" id="gs-round">10s</div>
      </div>
      <div class="stat-box">
        <div class="stat-lbl">Current CPS</div>
        <div class="stat-val" id="gs-stat3">0.0</div>
      </div>
      <div class="stat-box">
        <div class="stat-lbl">Best (10s / 20s)</div>
        <div class="stat-val" id="gs-pb">— / —</div>
      </div>
    </div>

    <div class="timer-bar">
      <div class="timer-fill" id="timerFill"></div>
    </div>

    <div class="game-area" id="gameArea">
      <div>
        <div class="instr">Click as fast as you can in the selected time limit! Check your clicks-per-second (CPS) score.</div>
        <div style="display: flex; gap: 12px; justify-content: center; margin-bottom: 1.5rem">
          <button class="sm-btn active" onclick="setDuration(10, this)" id="btn-10s">10 seconds</button>
          <button class="sm-btn" onclick="setDuration(20, this)" id="btn-20s">20 seconds</button>
        </div>
        <button class="big-btn" onclick="startClickCount()">Start Sprint — <span id="cc-dur">10s</span></button>
      </div>
    </div>
  </div>

  <script>
    let gameState = {
      clicks: 0,
      duration: 10,
      active: false,
      timeLeft: 0,
      startTime: 0
    };
    let timerInterval = null;

    function loadPB() {
      const pb10 = localStorage.getItem('pb_click_counter_10') || '—';
      const pb20 = localStorage.getItem('pb_click_counter_20') || '—';
      document.getElementById('gs-pb').textContent = `${pb10} / ${pb20}`;
    }
    loadPB();

    function setDuration(sec, btn) {
      if (gameState.active) return;
      gameState.duration = sec;
      document.getElementById('cc-dur').textContent = sec + 's';
      document.getElementById('gs-round').textContent = sec + 's';
      
      document.querySelectorAll('.sm-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    function startClickCount() {
      if (timerInterval) clearInterval(timerInterval);
      
      gameState.clicks = 0;
      gameState.active = true;
      gameState.timeLeft = gameState.duration;
      gameState.startTime = performance.now();
      
      document.getElementById('gs-score').textContent = '0';
      document.getElementById('gs-round').textContent = gameState.duration + 's';
      document.getElementById('gs-stat3').textContent = '0.0';
      
      const timerFill = document.getElementById('timerFill');
      timerFill.style.width = '100%';
      timerFill.style.background = 'var(--purple)';
      
      const area = document.getElementById('gameArea');
      area.innerHTML = `
        <div class="click-zone" id="clickZone" onclick="doClick()">
          <div style="text-align: center">
            <div class="click-count" id="ccNum">0</div>
            <div style="font-size: 0.8rem; color: var(--text3); font-family: 'Space Mono', monospace; font-weight: 700; letter-spacing: 1px;">CLICK HERE!</div>
          </div>
        </div>
      `;
      
      timerInterval = setInterval(() => {
        gameState.timeLeft--;
        document.getElementById('gs-round').textContent = gameState.timeLeft + 's';
        
        const pct = (gameState.timeLeft / gameState.duration) * 100;
        timerFill.style.width = pct + '%';
        if (gameState.timeLeft <= 3) {
          timerFill.style.background = 'var(--red)';
        }
        
        if (gameState.timeLeft <= 0) {
          clearInterval(timerInterval);
          gameState.active = false;
          endClickCount();
        }
      }, 1000);
    }

    function doClick() {
      if (!gameState.active) return;
      gameState.clicks++;
      
      document.getElementById('ccNum').textContent = gameState.clicks;
      document.getElementById('gs-score').textContent = gameState.clicks;
      
      const elapsed = (performance.now() - gameState.startTime) / 1000;
      const cps = (gameState.clicks / elapsed).toFixed(1);
      document.getElementById('gs-stat3').textContent = cps;
    }

    function endClickCount() {
      const cps = (gameState.clicks / gameState.duration).toFixed(1);
      
      // Update PB
      const key = `pb_click_counter_${gameState.duration}`;
      const pb = localStorage.getItem(key);
      if (!pb || gameState.clicks > parseInt(pb)) {
        localStorage.setItem(key, gameState.clicks);
      }
      loadPB();
      
      const area = document.getElementById('gameArea');
      area.innerHTML = `
        <div class="fade-in" style="text-align: center; width: 100%;">
          <div class="result-score">${gameState.clicks}</div>
          <div class="result-lbl">total clicks</div>
          <div class="result-sub" style="margin-bottom: 1.5rem;">
            Average Speed: <strong>${cps} clicks/sec</strong><br>
            Duration Sprint: <strong>${gameState.duration} seconds</strong>
          </div>
          <div class="btn-row">
            <button class="sm-btn" onclick="resetGame()">Try Again</button>
            <a href="reflex_arena.html" class="sm-btn">Reflex Arena</a>
          </div>
        </div>
      `;
    }

    function resetGame() {
      const area = document.getElementById('gameArea');
      area.innerHTML = `
        <div>
          <div class="instr">Click as fast as you can in the selected time limit! Check your clicks-per-second (CPS) score.</div>
          <div style="display: flex; gap: 12px; justify-content: center; margin-bottom: 1.5rem">
            <button class="sm-btn ${gameState.duration === 10 ? 'active' : ''}" onclick="setDuration(10, this)" id="btn-10s">10 seconds</button>
            <button class="sm-btn ${gameState.duration === 20 ? 'active' : ''}" onclick="setDuration(20, this)" id="btn-20s">20 seconds</button>
          </div>
          <button class="big-btn" onclick="startClickCount()">Start Sprint — <span id="cc-dur">${gameState.duration}s</span></button>
        </div>
      `;
      document.getElementById('gs-score').textContent = '0';
      document.getElementById('gs-round').textContent = gameState.duration + 's';
      document.getElementById('gs-stat3').textContent = '0.0';
      document.getElementById('timerFill').style.width = '100%';
      document.getElementById('timerFill').style.background = 'var(--purple)';
    }
  </script>
</body>
</html>
