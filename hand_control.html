<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hand Control Test — Reflex Arena Standalone</title>
  <meta name="description" content="Test your motor control and tracing accuracy. Trace lines, circles, and zigzags as accurately as possible.">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #080810;
      --bg2: #0f0e1a;
      --bg3: #16152a;
      --bg4: #1c1b33;
      --purple: #7c6fdd;
      --purple2: #a99ef5;
      --purple3: #3d3580;
      --green: #34d399;
      --red: #f87171;
      --amber: #fbbf24;
      --cyan: #22d3ee;
      --text: #e8e4ff;
      --text2: #9990cc;
      --text3: #4a4480;
      --border: #2a2840;
      --glow: rgba(124, 111, 221, 0.15);
    }
    body {
      font-family: 'Syne', sans-serif;
      background: var(--bg);
      background-image: 
        radial-gradient(at 0% 0%, rgba(124, 111, 221, 0.08) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(34, 211, 238, 0.05) 0px, transparent 50%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      overflow-x: hidden;
    }
    .game-container {
      width: 100%;
      max-width: 640px;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 2rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 50px var(--glow);
      position: relative;
      animation: fadeIn 0.4s ease-out;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1.25rem;
    }
    .back-btn {
      background: var(--bg3);
      border: 1px solid var(--border);
      color: var(--text2);
      padding: 8px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-family: 'Space Mono', monospace;
      font-size: 0.75rem;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .back-btn:hover {
      border-color: var(--purple);
      color: var(--purple2);
      box-shadow: 0 0 10px rgba(124, 111, 221, 0.2);
    }
    .title-wrap h1 {
      font-size: 1.5rem;
      font-weight: 900;
      letter-spacing: -1px;
      background: linear-gradient(135deg, var(--purple2), var(--cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .title-wrap p {
      font-size: 0.65rem;
      font-family: 'Space Mono', monospace;
      color: var(--text3);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 2px;
    }
    .stats-row {
      display: flex;
      gap: 12px;
      margin-bottom: 1rem;
    }
    .stat-box {
      flex: 1;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.75rem;
      text-align: center;
      transition: all 0.2s;
    }
    .stat-lbl {
      font-size: 0.6rem;
      font-family: 'Space Mono', monospace;
      color: var(--text3);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }
    .stat-val {
      font-size: 1.5rem;
      font-weight: 700;
      font-family: 'Space Mono', monospace;
      color: var(--purple2);
    }
    .game-area {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.5rem;
      min-height: 300px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .instr {
      font-size: 0.85rem;
      color: var(--text2);
      line-height: 1.6;
      margin-bottom: 1.25rem;
      font-family: 'Space Mono', monospace;
      max-width: 480px;
    }
    #drawCanvas {
      border-radius: 12px;
      max-width: 100%;
      border: 1px solid var(--border);
      cursor: crosshair;
      touch-action: none;
      background: #0f0e1a;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
    }
    .big-btn {
      background: var(--purple3);
      border: 1px solid var(--purple);
      color: #fff;
      padding: 1rem 3rem;
      border-radius: 14px;
      font-family: 'Syne', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 15px rgba(124, 111, 221, 0.25);
    }
    .big-btn:hover {
      background: var(--purple);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(124, 111, 221, 0.4);
    }
    .big-btn:active {
      transform: scale(0.97);
    }
    .sm-btn {
      background: var(--bg4);
      border: 1px solid var(--border);
      color: var(--purple2);
      padding: 0.7rem 1.4rem;
      border-radius: 10px;
      cursor: pointer;
      font-family: 'Syne', sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      transition: all 0.15s;
    }
    .sm-btn:hover {
      border-color: var(--purple);
      background: var(--bg3);
      color: #fff;
    }
    .sm-btn.active {
      border-color: var(--purple);
      background: var(--purple3);
      color: #fff;
      box-shadow: 0 0 10px rgba(124, 111, 221, 0.25);
    }
    .btn-row {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-top: 1.5rem;
    }
    .result-score {
      font-size: 4.5rem;
      font-weight: 900;
      color: var(--purple2);
      font-family: 'Space Mono', monospace;
      line-height: 1;
      margin-bottom: 8px;
      text-shadow: 0 0 20px rgba(124, 111, 221, 0.3);
    }
    .result-lbl {
      font-size: 0.75rem;
      color: var(--text3);
      font-family: 'Space Mono', monospace;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 1.25rem;
    }
    .result-sub {
      font-size: 0.95rem;
      color: var(--text2);
      margin-bottom: 0.5rem;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="game-container">
    <header class="header">
      <div class="title-wrap">
        <h1>Hand Control</h1>
        <p>✏️ motor control &amp; precision test</p>
      </div>
      <a href="index.html" class="back-btn">← Main Hub</a>
    </header>

    <div class="stats-row">
      <div class="stat-box">
        <div class="stat-lbl">Accuracy</div>
        <div class="stat-val" id="gs-score">0%</div>
      </div>
      <div class="stat-box">
        <div class="stat-lbl">Active Challenge</div>
        <div class="stat-val" id="gs-round">Circle</div>
      </div>
      <div class="stat-box">
        <div class="stat-lbl" id="pb-lbl">PB (Circle)</div>
        <div class="stat-val" id="gs-pb">—</div>
      </div>
    </div>

    <div class="game-area" id="gameArea">
      <div>
        <div class="instr">
          Test your hand-eye coordination. Trace the guide path as accurately as possible.<br>
          Select your challenge style to begin:
        </div>
        <div style="display: flex; gap: 10px; justify-content: center; margin-bottom: 1.5rem; flex-wrap: wrap;">
          <button class="sm-btn active" onclick="selectChallenge('circle', this)">⭕ Circle Trace</button>
          <button class="sm-btn" onclick="selectChallenge('line', this)">📏 Straight Line</button>
          <button class="sm-btn" onclick="selectChallenge('zigzag', this)">〰️ Zigzag Route</button>
        </div>
        <canvas id="drawCanvas" width="520" height="300"></canvas>
      </div>
    </div>
  </div>

  <script>
    let gameState = {
      mode: 'circle',
      active: false,
      drawing: false,
      points: []
    };
    let delayTimeout = null;

    function loadPB() {
      const pbVal = localStorage.getItem(`pb_hand_control_${gameState.mode}`) || '—';
      document.getElementById('pb-lbl').textContent = `PB (${gameState.mode.toUpperCase()})`;
      document.getElementById('gs-pb').textContent = pbVal !== '—' ? `${pbVal}%` : pbVal;
    }
    loadPB();

    function selectChallenge(mode, btn) {
      gameState.mode = mode;
      document.querySelectorAll('.sm-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('gs-round').textContent = mode.charAt(0).toUpperCase() + mode.slice(1);
      
      loadPB();
      startDraw(mode);
    }

    function startDraw(mode) {
      if (delayTimeout) clearTimeout(delayTimeout);
      
      gameState.points = [];
      gameState.drawing = false;
      gameState.active = true;
      
      const cv = document.getElementById('drawCanvas');
      if (!cv) return;
      const ctx = cv.getContext('2d');
      
      // Clean canvas and draw the guide path
      ctx.clearRect(0, 0, cv.width, cv.height);
      ctx.fillStyle = '#0f0e1a';
      ctx.fillRect(0, 0, cv.width, cv.height);
      
      ctx.setLineDash([6, 4]);
      ctx.strokeStyle = 'rgba(124, 111, 221, 0.45)';
      ctx.lineWidth = 3;
      
      if (mode === 'circle') {
        ctx.beginPath();
        ctx.arc(260, 150, 100, 0, Math.PI * 2);
        ctx.stroke();
        
        ctx.fillStyle = 'rgba(153, 144, 204, 0.5)';
        ctx.font = '0.75rem Space Mono, monospace';
        ctx.textAlign = 'center';
        ctx.fillText('Trace along this circular path', 260, 275);
      } else if (mode === 'line') {
        ctx.beginPath();
        ctx.moveTo(60, 150);
        ctx.lineTo(460, 150);
        ctx.stroke();
        
        ctx.fillStyle = 'rgba(153, 144, 204, 0.5)';
        ctx.font = '0.75rem Space Mono, monospace';
        ctx.textAlign = 'center';
        ctx.fillText('Draw a straight line left to right', 260, 275);
      } else if (mode === 'zigzag') {
        ctx.beginPath();
        ctx.moveTo(60, 80);
        for (let x = 60; x <= 460; x += 100) {
          const isEven = Math.floor((x - 60) / 100) % 2 === 0;
          ctx.lineTo(x, isEven ? 80 : 220);
        }
        ctx.stroke();
        
        ctx.fillStyle = 'rgba(153, 144, 204, 0.5)';
        ctx.font = '0.75rem Space Mono, monospace';
        ctx.textAlign = 'center';
        ctx.fillText('Trace the zigzag lines in one motion', 260, 275);
      }
      ctx.setLineDash([]);

      // Bind Mouse Events
      cv.onmousedown = (e) => {
        if (!gameState.active) return;
        gameState.drawing = true;
        gameState.points = [];
        addDrawPoint(cv, e);
      };
      cv.onmousemove = (e) => {
        if (gameState.drawing) addDrawPoint(cv, e);
      };
      cv.onmouseup = () => {
        if (gameState.drawing) {
          gameState.drawing = false;
          scoreDraw(cv);
        }
      };
      cv.onmouseleave = () => {
        if (gameState.drawing) {
          gameState.drawing = false;
          scoreDraw(cv);
        }
      };

      // Bind Touch Events
      cv.ontouchstart = (e) => {
        e.preventDefault();
        if (!gameState.active) return;
        gameState.drawing = true;
        gameState.points = [];
        addDrawPoint(cv, e.touches[0]);
      };
      cv.ontouchmove = (e) => {
        e.preventDefault();
        if (gameState.drawing) addDrawPoint(cv, e.touches[0]);
      };
      cv.ontouchend = () => {
        if (gameState.drawing) {
          gameState.drawing = false;
          scoreDraw(cv);
        }
      };
    }

    // Auto initialize circle trace guide
    setTimeout(() => startDraw('circle'), 50);

    function addDrawPoint(cv, e) {
      const rect = cv.getBoundingClientRect();
      const scaleX = cv.width / rect.width;
      const scaleY = cv.height / rect.height;
      const x = (e.clientX - rect.left) * scaleX;
      const y = (e.clientY - rect.top) * scaleY;
      
      gameState.points.push({ x, y });
      
      const ctx = cv.getContext('2d');
      if (gameState.points.length > 1) {
        const p = gameState.points;
        ctx.beginPath();
        ctx.moveTo(p[p.length - 2].x, p[p.length - 2].y);
        ctx.lineTo(x, y);
        ctx.strokeStyle = 'var(--cyan)';
        ctx.lineWidth = 3.5;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.stroke();
      }
    }

    function scoreDraw(cv) {
      const pts = gameState.points;
      if (pts.length < 10) {
        // Not enough points to score
        startDraw(gameState.mode);
        return;
      }
      
      gameState.active = false;
      let acc = 0;
      
      if (gameState.mode === 'circle') {
        const cx = 260, cy = 150, r = 100;
        const dists = pts.map(p => Math.abs(Math.sqrt((p.x - cx) ** 2 + (p.y - cy) ** 2) - r));
        const avgErr = dists.reduce((a, b) => a + b, 0) / dists.length;
        acc = Math.max(0, Math.round(100 - avgErr * 1.6));
      } else if (gameState.mode === 'line') {
        const errs = pts.map(p => Math.abs(p.y - 150));
        const avgErr = errs.reduce((a, b) => a + b, 0) / errs.length;
        acc = Math.max(0, Math.round(100 - avgErr * 2.2));
      } else {
        // Zigzag: score deviation from the straight segments
        let totalErr = 0;
        pts.forEach(p => {
          const seg = Math.min(3, Math.max(0, Math.floor((p.x - 60) / 100)));
          const isEven = seg % 2 === 0;
          
          // Linear interpolation between start and end of zigzag segment
          const startX = 60 + seg * 100;
          const startY = isEven ? 80 : 220;
          const endY = isEven ? 220 : 80;
          
          let t = (p.x - startX) / 100;
          t = Math.min(1, Math.max(0, t));
          const expectedY = startY + t * (endY - startY);
          
          totalErr += Math.abs(p.y - expectedY);
        });
        acc = Math.max(0, Math.round(100 - (totalErr / pts.length) * 0.9));
      }

      document.getElementById('gs-score').textContent = acc + '%';
      
      // Save high score
      const pbKey = `pb_hand_control_${gameState.mode}`;
      const storedPB = localStorage.getItem(pbKey);
      if (!storedPB || acc > parseInt(storedPB)) {
        localStorage.setItem(pbKey, acc);
      }
      loadPB();

      // Show temporary score overlay on the canvas
      const ctx = cv.getContext('2d');
      ctx.fillStyle = 'rgba(8, 8, 16, 0.75)';
      ctx.fillRect(0, 0, cv.width, cv.height);
      
      ctx.fillStyle = acc > 80 ? 'var(--green)' : acc > 60 ? 'var(--amber)' : 'var(--red)';
      ctx.font = 'bold 2.2rem Syne, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(acc + '% Accuracy', 260, 130);
      
      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      ctx.font = '0.9rem Space Mono, monospace';
      ctx.fillText(acc > 80 ? 'Excellent control! 🎯' : acc > 60 ? 'Good effort — trace carefully 👍' : 'Keep practicing! 💪', 260, 170);

      delayTimeout = setTimeout(() => {
        const area = document.getElementById('gameArea');
        area.innerHTML = `
          <div class="fade-in" style="text-align: center; width: 100%;">
            <div class="result-score">${acc}%</div>
            <div class="result-lbl">hand control accuracy</div>
            <div class="result-sub" style="margin-bottom: 1.5rem;">
              Challenge Type: <strong>${gameState.mode.toUpperCase()}</strong><br>
              Performance Rating: <strong>${acc > 80 ? 'Perfect Precision' : acc > 60 ? 'Decent Control' : 'Unstable Path'}</strong>
            </div>
            <div class="btn-row">
              <button class="sm-btn" onclick="resetGame()">Try Again</button>
              <a href="reflex_arena.html" class="sm-btn">Reflex Arena</a>
            </div>
          </div>
        `;
      }, 1800);
    }

    function resetGame() {
      const area = document.getElementById('gameArea');
      area.innerHTML = `
        <div>
          <div class="instr">
            Test your hand-eye coordination. Trace the guide path as accurately as possible.<br>
            Select your challenge style to begin:
          </div>
          <div style="display: flex; gap: 10px; justify-content: center; margin-bottom: 1.5rem; flex-wrap: wrap;">
            <button class="sm-btn ${gameState.mode === 'circle' ? 'active' : ''}" onclick="selectChallenge('circle', this)">⭕ Circle Trace</button>
            <button class="sm-btn ${gameState.mode === 'line' ? 'active' : ''}" onclick="selectChallenge('line', this)">📏 Straight Line</button>
            <button class="sm-btn ${gameState.mode === 'zigzag' ? 'active' : ''}" onclick="selectChallenge('zigzag', this)">〰️ Zigzag Route</button>
          </div>
          <canvas id="drawCanvas" width="520" height="300"></canvas>
        </div>
      `;
      document.getElementById('gs-score').textContent = '0%';
      loadPB();
      startDraw(gameState.mode);
    }
  </script>
</body>
</html>
