<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Boss Rush</title>
<link rel="icon" href="assets/logo.png">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#040008;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Segoe UI',Arial,sans-serif;color:#f0e8ff;overflow:hidden}
  h1{font-size:1.5rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase;background:linear-gradient(90deg,#ff4422,#ff8800,#ffcc44);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:10px}
  #wrap{position:relative}
  canvas{display:block;border-radius:14px;box-shadow:0 0 80px rgba(255,60,10,.15),0 0 0 1.5px rgba(255,80,20,.18)}
  /* HP bars */
  #bars{display:flex;justify-content:space-between;align-items:center;padding:10px 4px;gap:20px}
  .bar-wrap{flex:1}
  .bar-label{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#706080;margin-bottom:4px}
  .bar-track{height:14px;border-radius:999px;background:#0a0010;overflow:hidden;border:1px solid rgba(255,255,255,.06)}
  .bar-fill{height:100%;border-radius:999px;transition:width .15s}
  #playerHp .bar-fill{background:linear-gradient(90deg,#4a8fff,#22aaff)}
  #bossHp .bar-fill{background:linear-gradient(90deg,#ff2200,#ff6600,#ffaa00)}
  .bar-val{font-size:.78rem;color:#a090c0;margin-top:3px;text-align:right}
  /* Overlay */
  #overlay{position:absolute;inset:0;border-radius:14px;background:rgba(4,0,10,.88);backdrop-filter:blur(6px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
  #overlay.hidden{display:none}
  .ot{font-size:2.2rem;font-weight:900;letter-spacing:.06em}
  .os{font-size:.9rem;color:#8070a0;text-align:center;line-height:1.7;max-width:300px}
  #startBtn{padding:12px 36px;border-radius:999px;border:1.5px solid rgba(255,80,10,.38);background:rgba(255,60,10,.12);color:#ffaa60;font-size:.95rem;font-weight:700;cursor:pointer;transition:background .2s}
  #startBtn:hover{background:rgba(255,60,10,.28)}
  #hint{font-size:.76rem;color:#302030;text-align:center;margin-top:8px}
</style>
</head>
<body>
<h1>💀 Boss Rush</h1>
<div id="wrap">
  <div id="bars">
    <div class="bar-wrap">
      <div class="bar-label">Your HP</div>
      <div class="bar-track"><div class="bar-fill" id="playerFill" style="width:100%"></div></div>
      <div class="bar-val" id="playerVal">100 / 100</div>
    </div>
    <div style="font-size:.78rem;color:#504060;font-weight:700;min-width:80px;text-align:center" id="phaseLabel">Phase 1</div>
    <div class="bar-wrap">
      <div class="bar-label" style="text-align:right">BOSS HP</div>
      <div class="bar-track"><div class="bar-fill" id="bossFill" style="width:100%"></div></div>
      <div class="bar-val" id="bossVal">300 / 300</div>
    </div>
  </div>
  <canvas id="c" width="880" height="400"></canvas>
  <div id="overlay">
    <div class="ot" id="oTitle" style="background:linear-gradient(90deg,#ff4422,#ffaa00);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text">BOSS RUSH</div>
    <div class="os" id="oSub">Defeat 3 increasingly powerful bosses.<br><br>WASD / Arrow Keys — Move<br>Space — Shoot<br>Survive boss attacks!</div>
    <button id="startBtn">▶ START</button>
  </div>
</div>
<div id="hint">Dodge red projectiles · Shoot space · Each boss has unique attack patterns</div>

<script>
const c=document.getElementById('c');
const ctx=c.getContext('2d');
const W=c.width,H=c.height;
const playerFill=document.getElementById('playerFill');
const bossFill=document.getElementById('bossFill');
const playerVal=document.getElementById('playerVal');
const bossVal=document.getElementById('bossVal');
const phaseLabel=document.getElementById('phaseLabel');
const overlay=document.getElementById('overlay');
const oTitle=document.getElementById('oTitle');
const oSub=document.getElementById('oSub');
const startBtn=document.getElementById('startBtn');

/* ── Bosses ── */
const BOSSES=[
  {name:'THE SENTINEL',maxHp:300,col:'#cc2200',glow:'#ff4422',size:64,speed:1.2,
   atkCooldown:80,atkFn:'spread',phase:'Phase 1 of 3',bg:'#08000f'},
  {name:'VOID TITAN',maxHp:500,col:'#220066',glow:'#6600ff',size:80,speed:1.8,
   atkCooldown:55,atkFn:'wave',phase:'Phase 2 of 3',bg:'#03000a'},
  {name:'INFERNO KING',maxHp:800,col:'#883300',glow:'#ff6600',size:96,speed:2.4,
   atkCooldown:38,atkFn:'spiral',phase:'Phase 3 of 3',bg:'#090200'},
];

let running=false,dead=false;
let bossIdx=0;
let player,boss,bullets,enemyBullets,particles;
let keys={};
let atkTimer=0,bossAngle=0,spiralAngle=0;

const PLAYER_MAX_HP=100;
const PLAYER_SPEED=4.5;
const BULLET_DMG=8;

function initGame(){
  bossIdx=0;
  player={x:100,y:H/2,w:30,h:30,hp:PLAYER_MAX_HP,iframes:0};
  bullets=[];enemyBullets=[];particles=[];
  atkTimer=0;
  startBoss();
}

function startBoss(){
  const b=BOSSES[bossIdx];
  boss={...b,hp:b.maxHp,x:W-120,y:H/2,vy:b.speed,phase:bossIdx+1,angle:0};
  updateBossBar();updatePlayerBar();
  phaseLabel.textContent=b.phase;
}

function updatePlayerBar(){
  const pct=Math.max(0,player.hp/PLAYER_MAX_HP*100);
  playerFill.style.width=pct+'%';
  playerVal.textContent=`${Math.max(0,player.hp)} / ${PLAYER_MAX_HP}`;
}
function updateBossBar(){
  const pct=Math.max(0,boss.hp/BOSSES[bossIdx].maxHp*100);
  bossFill.style.width=pct+'%';
  bossVal.textContent=`${Math.max(0,boss.hp)} / ${BOSSES[bossIdx].maxHp}`;
}

/* ── Attack functions ── */
function atkSpread(){
  const angles=[-0.4,-0.18,0,0.18,0.4];
  angles.forEach(a=>{
    const speed=4+bossIdx*.8;
    enemyBullets.push({x:boss.x-boss.size/2,y:boss.y,vx:-Math.cos(a)*speed,vy:Math.sin(a)*speed,r:7,col:'#ff3300',glow:'#ff5522',life:1});
  });
}
function atkWave(){
  for(let i=0;i<8;i++){
    const a=(Math.PI*2/8)*i;
    enemyBullets.push({x:boss.x,y:boss.y,vx:Math.cos(a)*3.5,vy:Math.sin(a)*3.5,r:6,col:'#8800ff',glow:'#aa44ff',life:1});
  }
}
function atkSpiral(){
  for(let i=0;i<5;i++){
    const a=spiralAngle+i*(Math.PI*2/5);
    enemyBullets.push({x:boss.x,y:boss.y,vx:Math.cos(a)*4.5,vy:Math.sin(a)*4.5,r:8,col:'#ff6600',glow:'#ffaa00',life:1});
  }
  spiralAngle+=.35;
}

function spawnParticles(x,y,col,n=8){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,v=1+Math.random()*4;
    particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,col,r:2+Math.random()*4});
  }
}

/* ── Update ── */
function update(){
  if(!running) return;

  /* player move */
  const spd=PLAYER_SPEED;
  if((keys.ArrowLeft||keys.KeyA)&&player.x>18) player.x-=spd;
  if((keys.ArrowRight||keys.KeyD)&&player.x<W*.48) player.x+=spd;
  if((keys.ArrowUp||keys.KeyW)&&player.y>18) player.y-=spd;
  if((keys.ArrowDown||keys.KeyS)&&player.y<H-18) player.y+=spd;
  if(player.iframes>0) player.iframes--;

  /* boss movement */
  boss.y+=boss.vy;
  if(boss.y<boss.size/2+20||boss.y>H-boss.size/2-20) boss.vy*=-1;
  boss.angle+=.025;

  /* boss attack */
  atkTimer--;
  if(atkTimer<=0){
    const fn=BOSSES[bossIdx].atkFn;
    if(fn==='spread') atkSpread();
    else if(fn==='wave') atkWave();
    else atkSpiral();
    atkTimer=BOSSES[bossIdx].atkCooldown;
  }

  /* player bullets */
  if(keys.Space){
    if(!player._shotTimer||player._shotTimer<=0){
      bullets.push({x:player.x+15,y:player.y,vx:9,vy:0,r:5,col:'#4a8fff',glow:'#88ccff'});
      player._shotTimer=10;
    }
  }
  if(player._shotTimer>0) player._shotTimer--;

  /* move player bullets */
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    b.x+=b.vx;
    if(b.x>W+20){bullets.splice(i,1);continue;}
    /* hit boss */
    const dx=b.x-boss.x,dy=b.y-boss.y;
    if(Math.hypot(dx,dy)<boss.size/2+b.r){
      bullets.splice(i,1);
      boss.hp-=BULLET_DMG;
      spawnParticles(b.x,b.y,'#88ccff',5);
      updateBossBar();
      if(boss.hp<=0){
        bossDefeated();return;
      }
    }
  }

  /* enemy bullets */
  for(let i=enemyBullets.length-1;i>=0;i--){
    const b=enemyBullets[i];
    b.x+=b.vx;b.y+=b.vy;
    b.life-=.003;
    if(b.x<-20||b.x>W+20||b.y<-20||b.y>H+20||b.life<=0){enemyBullets.splice(i,1);continue;}
    /* hit player */
    if(player.iframes<=0){
      const dx=b.x-player.x,dy=b.y-player.y;
      if(Math.hypot(dx,dy)<b.r+12){
        enemyBullets.splice(i,1);
        player.hp-=10+bossIdx*4;
        player.iframes=45;
        spawnParticles(player.x,player.y,'#4a8fff',6);
        updatePlayerBar();
        if(player.hp<=0){playerDied();return;}
      }
    }
  }

  /* particles */
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx;p.y+=p.vy;p.vy+=.05;p.life-=.03;
    if(p.life<=0) particles.splice(i,1);
  }
}

/* ── Draw ── */
function drawBoss(){
  ctx.save();
  /* aura */
  ctx.shadowColor=boss.glow;ctx.shadowBlur=50;
  ctx.globalAlpha=.35;
  ctx.fillStyle=boss.glow;
  ctx.beginPath();ctx.arc(boss.x,boss.y,boss.size*.85,0,Math.PI*2);ctx.fill();
  ctx.globalAlpha=1;

  /* body */
  ctx.shadowColor=boss.glow;ctx.shadowBlur=30;
  ctx.fillStyle=boss.col;
  ctx.save();
  ctx.translate(boss.x,boss.y);
  ctx.rotate(boss.angle);
  /* Irregular boss shape */
  ctx.beginPath();
  const s=boss.size/2;
  for(let i=0;i<8;i++){
    const a=(Math.PI*2/8)*i;
    const r=s*(0.8+.2*Math.sin(i*3+boss.angle*2));
    const px2=Math.cos(a)*r,py2=Math.sin(a)*r;
    i===0?ctx.moveTo(px2,py2):ctx.lineTo(px2,py2);
  }
  ctx.closePath();ctx.fill();

  /* glowing eye */
  ctx.shadowBlur=20;
  ctx.fillStyle='#fff';
  ctx.beginPath();ctx.arc(0,0,s*.22,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=boss.glow;
  ctx.beginPath();ctx.arc(0,0,s*.12,0,Math.PI*2);ctx.fill();

  ctx.restore();
  ctx.restore();

  /* HP crack marks at low HP */
  if(boss.hp<BOSSES[bossIdx].maxHp*.3){
    ctx.save();
    ctx.strokeStyle='rgba(255,255,255,.25)';ctx.lineWidth=1.5;
    ctx.setLineDash([4,4]);
    ctx.translate(boss.x,boss.y);
    ctx.rotate(boss.angle*.7);
    ctx.beginPath();ctx.moveTo(-20,-30);ctx.lineTo(10,20);ctx.stroke();
    ctx.restore();
  }
}

function drawPlayer(){
  const alpha=player.iframes>0&&Math.floor(player.iframes/5)%2===0?.4:1;
  ctx.save();
  ctx.globalAlpha=alpha;
  ctx.shadowColor='#4a8fff';ctx.shadowBlur=24;
  ctx.fillStyle='#4a8fff';
  ctx.beginPath();
  /* ship shape */
  ctx.moveTo(player.x+15,player.y);
  ctx.lineTo(player.x-15,player.y-12);
  ctx.lineTo(player.x-8,player.y);
  ctx.lineTo(player.x-15,player.y+12);
  ctx.closePath();ctx.fill();
  /* cockpit */
  ctx.shadowBlur=8;ctx.fillStyle='#c0e8ff';
  ctx.beginPath();ctx.ellipse(player.x+2,player.y,6,5,0,0,Math.PI*2);ctx.fill();
  /* engine glow */
  ctx.shadowColor='#ff6a1a';ctx.shadowBlur=20;
  ctx.fillStyle='rgba(255,106,26,.7)';
  ctx.fillRect(player.x-16,player.y-4,6,8);
  ctx.restore();
}

function render(){
  const bgCol=BOSSES[bossIdx]?.bg||'#040008';
  ctx.fillStyle=bgCol;ctx.fillRect(0,0,W,H);

  /* stars */
  for(let i=0;i<80;i++){
    const sx=(i*67)%W,sy=(i*43)%H;
    ctx.fillStyle=`rgba(255,255,255,${.1+.2*(i%3===0?1:0)})`;
    ctx.fillRect(sx,sy,i%4===0?2:1,i%4===0?2:1);
  }

  /* arena boundary */
  ctx.strokeStyle='rgba(255,80,20,.08)';ctx.lineWidth=1.5;
  ctx.setLineDash([8,8]);
  ctx.strokeRect(8,8,W-16,H-16);
  ctx.setLineDash([]);

  /* particles */
  particles.forEach(p=>{
    ctx.save();
    ctx.globalAlpha=p.life*.8;
    ctx.fillStyle=p.col;ctx.shadowColor=p.col;ctx.shadowBlur=8;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r*p.life,0,Math.PI*2);ctx.fill();
    ctx.restore();
  });

  drawBoss();
  drawPlayer();

  /* player bullets */
  bullets.forEach(b=>{
    ctx.save();
    ctx.shadowColor=b.glow;ctx.shadowBlur=14;
    ctx.fillStyle=b.col;
    ctx.beginPath();ctx.ellipse(b.x,b.y,b.r,b.r/2,0,0,Math.PI*2);ctx.fill();
    ctx.restore();
  });

  /* enemy bullets */
  enemyBullets.forEach(b=>{
    ctx.save();
    ctx.globalAlpha=b.life;
    ctx.shadowColor=b.glow;ctx.shadowBlur=16;
    ctx.fillStyle=b.col;
    ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();
    /* core */
    ctx.fillStyle='rgba(255,255,255,.6)';
    ctx.beginPath();ctx.arc(b.x,b.y,b.r*.4,0,Math.PI*2);ctx.fill();
    ctx.restore();
  });

  /* boss name */
  ctx.save();
  ctx.font='700 13px Segoe UI';ctx.fillStyle='rgba(255,80,20,.6)';ctx.textAlign='center';
  ctx.fillText(BOSSES[bossIdx].name,boss.x,boss.y-boss.size/2-14);
  ctx.restore();
}

function gameLoop(){
  if(!running) return;
  update();render();
  requestAnimationFrame(gameLoop);
}

/* ── Boss defeated ── */
function bossDefeated(){
  spawnParticles(boss.x,boss.y,boss.glow,30);
  bossIdx++;
  if(bossIdx>=BOSSES.length){
    /* WIN */
    running=false;
    oTitle.textContent='VICTORY!';
    oTitle.style.background='linear-gradient(90deg,#44ff88,#00ccff)';
    oTitle.style['-webkit-background-clip']='text';
    oTitle.style['-webkit-text-fill-color']='transparent';
    oSub.innerHTML=`All 3 bosses defeated! 🏆<br>Remaining HP: ${player.hp}/${PLAYER_MAX_HP}`;
    startBtn.textContent='↺ PLAY AGAIN';
    overlay.classList.remove('hidden');
    return;
  }
  /* next boss */
  bullets=[];enemyBullets=[];atkTimer=60;
  startBoss();
}

function playerDied(){
  running=false;
  oTitle.textContent='DEFEATED';
  oTitle.style.background='linear-gradient(90deg,#ff3300,#ff8800)';
  oTitle.style['-webkit-background-clip']='text';
  oTitle.style['-webkit-text-fill-color']='transparent';
  oSub.innerHTML=`Fell to ${BOSSES[bossIdx].name}<br>Phase ${bossIdx+1} of 3<br><br>WASD Move · Space Shoot`;
  startBtn.textContent='↺ RETRY';
  overlay.classList.remove('hidden');
}

startBtn.addEventListener('click',()=>{
  initGame();running=true;
  overlay.classList.add('hidden');
  requestAnimationFrame(gameLoop);
});

window.addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space')e.preventDefault();});
window.addEventListener('keyup',e=>{keys[e.code]=false;});
</script>
</body>
</html>
