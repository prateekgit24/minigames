<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quiz Rush</title>
<link rel="icon" href="assets/logo.png">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#03050f;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Segoe UI',Arial,sans-serif;color:#e0eeff;overflow:hidden}
  h1{font-size:1.5rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;background:linear-gradient(90deg,#ff4488,#ffaa00,#4a8fff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:12px}
  #wrap{width:720px;max-width:95vw;position:relative}
  /* HUD */
  #hud{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-size:.8rem;color:#3a4a70}
  .hv{font-weight:900;color:#fff;font-size:.95rem;margin-left:4px}
  /* Timer ring */
  #timerWrap{position:relative;width:54px;height:54px;flex-shrink:0}
  #timerSvg{transform:rotate(-90deg)}
  #timerTxt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:1rem;color:#fff}
  /* Progress */
  #progress{height:6px;border-radius:999px;background:#07111e;margin-bottom:16px;overflow:hidden}
  #progressFill{height:100%;border-radius:999px;background:linear-gradient(90deg,#ff4488,#ffaa00);transition:width .4s}
  /* Card */
  #card{background:linear-gradient(165deg,#060f1e,#0a1628);border:1.5px solid rgba(74,143,255,.14);border-radius:20px;padding:30px;box-shadow:0 0 50px rgba(74,143,255,.07)}
  /* Category badge */
  #catBadge{display:inline-block;padding:5px 12px;border-radius:999px;font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:16px}
  /* Question */
  #question{font-size:1.25rem;font-weight:700;line-height:1.55;margin-bottom:24px;min-height:64px}
  /* Options */
  #opts{display:flex;flex-direction:column;gap:10px}
  .opt{padding:14px 20px;border-radius:12px;background:#07111e;border:1.5px solid rgba(74,143,255,.1);color:#c0d8ff;font-size:.96rem;font-weight:600;cursor:pointer;text-align:left;transition:background .15s,border-color .15s,transform .12s}
  .opt:hover:not([disabled]){background:rgba(74,143,255,.1);border-color:rgba(74,143,255,.38);transform:translateX(4px)}
  .opt.correct{background:rgba(68,220,120,.12)!important;border-color:rgba(68,220,120,.55)!important;color:#44ff88!important;box-shadow:0 0 18px rgba(68,220,120,.15)}
  .opt.wrong{background:rgba(255,60,60,.1)!important;border-color:rgba(255,60,60,.4)!important;color:#ff6666!important}
  /* streak */
  #streak{text-align:center;font-size:.85rem;font-weight:800;color:#ffaa00;min-height:22px;text-shadow:0 0 14px rgba(255,160,0,.4);transition:opacity .2s}
  /* overlay */
  #overlay{position:fixed;inset:0;background:rgba(3,5,15,.92);backdrop-filter:blur(8px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:100}
  #overlay.hidden{display:none}
  .ot{font-size:2rem;font-weight:900;background:linear-gradient(90deg,#ff4488,#ffaa00);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
  .obig{font-size:3rem;font-weight:900;color:#ffdd44}
  .os{color:#3a4a70;font-size:.88rem;text-align:center;line-height:1.7;max-width:320px}
  #startBtn{padding:12px 36px;border-radius:999px;border:1.5px solid rgba(255,80,120,.35);background:rgba(255,60,100,.1);color:#ff88aa;font-size:.95rem;font-weight:700;cursor:pointer;transition:background .2s}
  #startBtn:hover{background:rgba(255,60,100,.22)}
  /* diff */
  #diffWrap{display:flex;gap:8px;margin-bottom:10px}
  .dbtn{padding:7px 16px;border-radius:999px;border:1.5px solid rgba(255,80,120,.18);background:rgba(6,14,28,.8);color:#503050;font-size:.76rem;font-weight:700;cursor:pointer;transition:all .2s}
  .dbtn.active,.dbtn:hover{border-color:rgba(255,80,120,.45);color:#ff88aa;background:rgba(255,60,100,.1)}
  #hint{font-size:.74rem;color:#1a1830;margin-top:8px}
</style>
</head>
<body>
<h1>⚡ Quiz Rush</h1>
<div id="diffWrap">
  <button class="dbtn active" id="dEasy">Easy</button>
  <button class="dbtn" id="dMed">Medium</button>
  <button class="dbtn" id="dHard">Hard</button>
</div>
<div id="wrap">
  <div id="hud">
    <span>Score <span class="hv" id="scoreEl">0</span></span>
    <div id="timerWrap">
      <svg id="timerSvg" width="54" height="54">
        <circle cx="27" cy="27" r="22" fill="none" stroke="rgba(255,80,120,.1)" stroke-width="4"/>
        <circle id="timerArc" cx="27" cy="27" r="22" fill="none" stroke="#ff4488" stroke-width="4"
          stroke-dasharray="138.2" stroke-dashoffset="0" stroke-linecap="round" style="transition:stroke-dashoffset .4s,stroke .4s"/>
      </svg>
      <div id="timerTxt">—</div>
    </div>
    <span>Best <span class="hv" id="bestEl">0</span></span>
    <span>Q <span class="hv" id="qNumEl">1/10</span></span>
  </div>
  <div id="progress"><div id="progressFill" style="width:0%"></div></div>
  <div id="card">
    <div id="catBadge"></div>
    <div id="question"></div>
    <div id="streak"></div>
    <div id="opts"></div>
  </div>
</div>
<div id="overlay">
  <div class="ot" id="oTitle">QUIZ RUSH</div>
  <div class="obig" id="oBig" style="display:none"></div>
  <div class="os" id="oSub">10 questions per round · Beat the timer!<br>Streaks multiply your score.<br>Choose your difficulty.</div>
  <button id="startBtn">▶ START QUIZ</button>
</div>
<div id="hint">Answer fast — timer bonus! · Streaks = multiplier · 3 mistakes ends the run</div>

<script>
const QUESTIONS={
  easy:[
    {q:'What color do you get mixing blue and yellow?',opts:['Green','Purple','Orange','Red'],a:0,cat:'Colors'},
    {q:'Which planet is known as the Red Planet?',opts:['Venus','Mars','Jupiter','Saturn'],a:1,cat:'Space'},
    {q:'How many sides does a hexagon have?',opts:['5','7','6','8'],a:2,cat:'Shapes'},
    {q:'What is the boiling point of water (°C)?',opts:['90','110','80','100'],a:3,cat:'Science'},
    {q:'Which animal is known as man\'s best friend?',opts:['Cat','Horse','Dog','Rabbit'],a:2,cat:'Animals'},
    {q:'What is 7 × 8?',opts:['54','56','58','64'],a:1,cat:'Math'},
    {q:'Which continent is the Sahara Desert in?',opts:['Asia','Australia','Africa','South America'],a:2,cat:'Geography'},
    {q:'What language does "Hola" come from?',opts:['French','Portuguese','Italian','Spanish'],a:3,cat:'Languages'},
    {q:'How many months are in a year?',opts:['10','11','13','12'],a:3,cat:'General'},
    {q:'What is the largest ocean on Earth?',opts:['Atlantic','Indian','Pacific','Arctic'],a:2,cat:'Geography'},
    {q:'Which fruit is yellow and curved?',opts:['Apple','Banana','Grape','Mango'],a:1,cat:'Food'},
    {q:'How many legs does a spider have?',opts:['6','10','4','8'],a:3,cat:'Animals'},
    {q:'What is 15 + 27?',opts:['40','42','44','38'],a:1,cat:'Math'},
    {q:'Which is the largest planet in our solar system?',opts:['Saturn','Neptune','Jupiter','Uranus'],a:2,cat:'Space'},
  ],
  medium:[
    {q:'HTML stands for?',opts:['HyperText Markup Language','HighText Machine Language','HyperTool Markup Logic','HyperText Market Link'],a:0,cat:'Tech'},
    {q:'Which language runs natively in browsers?',opts:['Python','Ruby','JavaScript','PHP'],a:2,cat:'Tech'},
    {q:'What is 2 + 2 × 3?',opts:['12','8','10','6'],a:1,cat:'Math'},
    {q:'The Great Wall of China was primarily built to defend against which group?',opts:['Persians','Romans','Mongols','Vikings'],a:2,cat:'History'},
    {q:'Which element has symbol "O"?',opts:['Gold','Osmium','Oxygen','Oganesson'],a:2,cat:'Science'},
    {q:'What is the capital of Japan?',opts:['Seoul','Beijing','Tokyo','Bangkok'],a:2,cat:'Geography'},
    {q:'In what year did World War II end?',opts:['1943','1944','1946','1945'],a:3,cat:'History'},
    {q:'What does CPU stand for?',opts:['Central Processing Unit','Core Power Unit','Computer Processing Utility','Central Peripheral Unit'],a:0,cat:'Tech'},
    {q:'Which gas makes up most of Earth\'s atmosphere?',opts:['Oxygen','Carbon dioxide','Nitrogen','Argon'],a:2,cat:'Science'},
    {q:'Who painted the Mona Lisa?',opts:['Michelangelo','Raphael','da Vinci','Caravaggio'],a:2,cat:'Art'},
    {q:'What is the square root of 144?',opts:['11','13','14','12'],a:3,cat:'Math'},
    {q:'Which programming language is named after a coffee?',opts:['Python','Ruby','Java','Swift'],a:2,cat:'Tech'},
    {q:'How many bones does an adult human body have?',opts:['196','206','216','186'],a:1,cat:'Biology'},
    {q:'What is the chemical formula for water?',opts:['H2O','CO2','HO2','H2O2'],a:0,cat:'Science'},
  ],
  hard:[
    {q:'What is the time complexity of binary search?',opts:['O(n)','O(n log n)','O(log n)','O(1)'],a:2,cat:'CS'},
    {q:'Which sorting algorithm has worst-case O(n log n)?',opts:['Bubble Sort','Quick Sort','Merge Sort','Insertion Sort'],a:2,cat:'CS'},
    {q:'What is Avogadro\'s number (approx)?',opts:['3.14×10²³','6.02×10²³','1.38×10²³','9.11×10²³'],a:1,cat:'Science'},
    {q:'In which year was the C programming language created?',opts:['1965','1978','1969','1972'],a:3,cat:'Tech'},
    {q:'The Treaty of Westphalia (1648) ended which war?',opts:['Hundred Years War','The 30 Years War','The Crusades','The 7 Years War'],a:1,cat:'History'},
    {q:'What does REST stand for in web APIs?',opts:['Remote Execution State Transfer','Representational State Transfer','Recursive Endpoint State Transfer','Resource Entity State Transfer'],a:1,cat:'Tech'},
    {q:'Which law states F = ma?',opts:['Newton\'s 1st Law','Newton\'s 3rd Law','Newton\'s 2nd Law','Kepler\'s 2nd Law'],a:2,cat:'Physics'},
    {q:'What is the output of 0.1 + 0.2 in most languages?',opts:['0.3','0.30000001','0.2999999','0.30000000000000004'],a:3,cat:'CS'},
    {q:'In OSI model, which layer handles routing?',opts:['Transport','Data Link','Physical','Network'],a:3,cat:'Networking'},
    {q:'What is the Pythagorean theorem?',opts:['a²+b=c²','a+b²=c','a²+b²=c²','a×b=c²'],a:2,cat:'Math'},
    {q:'Which data structure uses LIFO?',opts:['Queue','Stack','Heap','Deque'],a:1,cat:'CS'},
    {q:'What is the powerhouse of the cell?',opts:['Nucleus','Ribosome','Golgi apparatus','Mitochondria'],a:3,cat:'Biology'},
    {q:'What does SQL stand for?',opts:['Structured Query Language','Simple Queue Logic','System Query Language','Structured Question Logic'],a:0,cat:'Tech'},
    {q:'Which planet has the most moons?',opts:['Jupiter','Uranus','Saturn','Neptune'],a:2,cat:'Space'},
  ]
};

const CAT_COLOURS={
  'Colors':'#ff6644','Space':'#4466ff','Shapes':'#aa44ff','Science':'#44aaff',
  'Animals':'#44dd88','Math':'#ffcc44','Geography':'#44ffcc','Languages':'#ff88aa',
  'General':'#8866ff','Food':'#ffaa44','Tech':'#4a8fff','History':'#ff8844',
  'Art':'#ff44cc','Biology':'#44ddaa','CS':'#44aaff','Physics':'#ffdd44',
  'Networking':'#88aaff'
};

const scoreEl=document.getElementById('scoreEl');
const bestEl=document.getElementById('bestEl');
const qNumEl=document.getElementById('qNumEl');
const progressFill=document.getElementById('progressFill');
const catBadge=document.getElementById('catBadge');
const questionEl=document.getElementById('question');
const optsEl=document.getElementById('opts');
const streakEl=document.getElementById('streak');
const timerArc=document.getElementById('timerArc');
const timerTxt=document.getElementById('timerTxt');
const overlay=document.getElementById('overlay');
const oTitle=document.getElementById('oTitle');
const oBig=document.getElementById('oBig');
const oSub=document.getElementById('oSub');
const startBtn=document.getElementById('startBtn');

const CIRC=2*Math.PI*22;
const TIME_PER_Q={easy:20,medium:15,hard:10};
const Q_COUNT=10;

let diff='easy',score=0,best=+localStorage.getItem('qrBest')||0;
let qSet,qi,streak,mistakes,timer,timerInterval,answered;
bestEl.textContent=best;

document.querySelectorAll('.dbtn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.dbtn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    diff=btn.id==='dEasy'?'easy':btn.id==='dMed'?'medium':'hard';
  });
});

function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}

function startGame(){
  qSet=shuffle(QUESTIONS[diff]).slice(0,Q_COUNT);
  qi=0;score=0;streak=0;mistakes=0;answered=false;
  scoreEl.textContent=0;streakEl.textContent='';
  overlay.classList.add('hidden');
  renderQ();
}

function renderQ(){
  if(qi>=qSet.length){endGame();return;}
  const q=qSet[qi];
  answered=false;
  /* progress */
  progressFill.style.width=(qi/Q_COUNT*100)+'%';
  qNumEl.textContent=`${qi+1}/${Q_COUNT}`;
  /* category badge */
  const col=CAT_COLOURS[q.cat]||'#4a8fff';
  catBadge.style.cssText=`background:${col}18;border:1px solid ${col}44;color:${col};padding:5px 12px;border-radius:999px;font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase`;
  catBadge.textContent=q.cat;
  /* question */
  questionEl.textContent=q.q;
  /* options — shuffled display but track correct */
  const optOrder=shuffle([0,1,2,3]);
  const correctDisplayIdx=optOrder.indexOf(q.a);
  optsEl.innerHTML='';
  optOrder.forEach((origIdx,dispIdx)=>{
    const btn=document.createElement('button');
    btn.className='opt';
    btn.textContent=q.opts[origIdx];
    btn.addEventListener('click',()=>answer(btn,dispIdx===correctDisplayIdx,q));
    optsEl.appendChild(btn);
  });
  /* streak display */
  if(streak>=2) streakEl.textContent=`🔥 ${streak} Streak! ×${Math.min(streak,5)}`;
  else streakEl.textContent='';
  /* timer */
  startTimer();
}

function startTimer(){
  clearInterval(timerInterval);
  const max=TIME_PER_Q[diff];
  timer=max;
  updateTimer(timer,max);
  timerInterval=setInterval(()=>{
    timer--;
    updateTimer(timer,max);
    if(timer<=0){
      clearInterval(timerInterval);
      if(!answered) timeOut();
    }
  },1000);
}

function updateTimer(t,max){
  timerTxt.textContent=t;
  const pct=t/max;
  timerArc.style.strokeDashoffset=CIRC*(1-pct);
  timerArc.style.stroke=pct>.5?'#ff4488':pct>.25?'#ffaa00':'#ff2222';
}

function answer(btn,correct,q){
  if(answered) return;
  answered=true;
  clearInterval(timerInterval);
  /* mark correct */
  const btns=[...optsEl.querySelectorAll('.opt')];
  btns.forEach(b=>b.disabled=true);
  if(correct){
    btn.classList.add('correct');
    streak++;
    const mul=Math.min(streak,5);
    const timeBonus=timer*2;
    const pts=(100+timeBonus)*mul;
    score+=pts;
    scoreEl.textContent=score;
    if(score>best){best=score;localStorage.setItem('qrBest',best);bestEl.textContent=best;}
    streakEl.textContent=`✅ +${pts}pts${mul>1?' (×'+mul+')':''}`;
  } else {
    btn.classList.add('wrong');
    /* find correct */
    /* we need to re-identify the correct button — it was marked via dispIdx===correctDisplayIdx */
    /* we stored no reference, so mark via text match */
    btns.forEach(b=>{if(b.textContent===q.opts[q.a]) b.classList.add('correct');});
    streak=0;mistakes++;
    streakEl.textContent=`❌ ${3-mistakes} mistakes left`;
    if(mistakes>=3){setTimeout(()=>endGame(true),900);return;}
  }
  setTimeout(()=>{qi++;renderQ();},900);
}

function timeOut(){
  answered=true;
  streak=0;mistakes++;
  streakEl.textContent=`⏱ Time's up! ${3-mistakes} mistakes left`;
  const btns=[...optsEl.querySelectorAll('.opt')];
  const q=qSet[qi];
  btns.forEach(b=>{b.disabled=true;if(b.textContent===q.opts[q.a])b.classList.add('correct');});
  if(mistakes>=3){setTimeout(()=>endGame(true),900);return;}
  setTimeout(()=>{qi++;renderQ();},900);
}

function endGame(earlyEnd=false){
  clearInterval(timerInterval);
  const total=qSet.length;
  const correct=qi-(mistakes>0?mistakes:0);
  progressFill.style.width='100%';
  const grade=score>=900?'S':score>=700?'A':score>=500?'B':score>=300?'C':'D';
  oTitle.textContent=earlyEnd?'ELIMINATED!':'ROUND COMPLETE!';
  oBig.textContent=score;oBig.style.display='block';
  oSub.innerHTML=`Grade: <strong style="color:#ffdd44;font-size:1.4rem">${grade}</strong> &nbsp;|&nbsp; Mistakes: ${mistakes}/3<br>Score: <strong style="color:#fff">${score}</strong>${score>=best?' 🏆 New Best!':''}`;
  startBtn.textContent='↺ PLAY AGAIN';
  overlay.classList.remove('hidden');
}

startBtn.addEventListener('click',startGame);
</script>
</body>
</html>
