<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tower Pulse</title>
<link rel="icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body {
    background: #02050a;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Outfit', sans-serif;
    color: #c8e4ff;
    overflow: hidden;
    background: radial-gradient(circle at 50% 50%, #060e22 0%, #02050a 100%);
  }
  h1 {
    font-size: 1.6rem;
    font-weight: 900;
    letter-spacing: .12em;
    text-transform: uppercase;
    background: linear-gradient(90deg, #ff55bb, #ff9933, #33ccff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  #wrap {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  canvas {
    display: block;
    border-radius: 16px;
    background: #030712;
    box-shadow: 0 0 60px rgba(255, 85, 187, 0.1), 0 0 0 1.5px rgba(255, 85, 187, 0.15);
  }
  #hud {
    display: flex;
    width: 100%;
    justify-content: space-between;
    padding: 10px 6px;
    font-size: .85rem;
    color: #4a6fa5;
    font-weight: 500;
  }
  .hv {
    font-weight: 800;
    color: #fff;
    font-size: 1rem;
    margin-left: 3px;
  }
  .heart {
    color: #ff3366;
    font-size: 1.1rem;
    letter-spacing: -2px;
    display: inline-block;
    text-shadow: 0 0 8px rgba(255, 51, 102, 0.6);
  }
  /* Overlay */
  #overlay {
    position: absolute;
    inset: 0;
    border-radius: 16px;
    background: rgba(3, 7, 18, 0.92);
    backdrop-filter: blur(8px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    z-index: 10;
    transition: opacity 0.3s ease;
  }
  #overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }
  .ot {
    font-size: 2.2rem;
    font-weight: 900;
    letter-spacing: .08em;
    background: linear-gradient(90deg, #ff55bb, #ff9933);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-align: center;
  }
  .obig {
    font-size: 3rem;
    font-weight: 900;
    color: #ffcc44;
    text-shadow: 0 0 20px rgba(255, 204, 68, 0.4);
  }
  .os {
    color: #4a6fa5;
    font-size: .9rem;
    text-align: center;
    line-height: 1.7;
    max-width: 320px;
    margin-bottom: 8px;
  }
  #startBtn {
    padding: 12px 38px;
    border-radius: 999px;
    border: 1.5px solid rgba(255, 85, 187, 0.4);
    background: rgba(255, 85, 187, 0.1);
    color: #ff88dd;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: 0 4px 15px rgba(255, 85, 187, 0.15);
  }
  #startBtn:hover {
    background: rgba(255, 85, 187, 0.22);
    border-color: rgba(255, 85, 187, 0.7);
    color: #fff;
    box-shadow: 0 4px 20px rgba(255, 85, 187, 0.3);
    transform: translateY(-1px);
  }
  #hint {
    font-size: .78rem;
    color: #1e2c4a;
    margin-top: 8px;
    text-align: center;
    font-weight: 500;
  }
</style>
</head>
<body>
<h1>🏗️ TOWER PULSE</h1>
<div id="wrap">
  <div id="hud">
    <span>Floors <span class="hv" id="scoreEl">0</span></span>
    <span>Combo <span class="hv" id="comboEl">×0</span></span>
    <span>Best <span class="hv" id="bestEl">0</span></span>
    <span style="margin-left: auto;">Lives: <span id="livesEl" class="heart">❤️❤️❤️</span></span>
  </div>
  <canvas id="c" width="440" height="580"></canvas>
  <div id="overlay">
    <div class="ot" id="oTitle">TOWER PULSE</div>
    <div class="obig" id="oBig" style="display:none">0</div>
    <div class="os" id="oSub">
      Drop floors from the moving crane!<br>
      Align them with the tower below.<br>
      Any overhang will be sliced off!<br><br>
      <span style="color:#ff88dd">Space / Tap / Click</span> to drop floor.
    </div>
    <button id="startBtn">▶ START STACKING</button>
  </div>
</div>
<div id="hint">Spacebar or Click canvas to drop · Trimmed blocks shrink · Perfect drops widen block</div>

<script>
const c=document.getElementById('c');
const ctx=c.getContext('2d');
const W=c.width,H=c.height;
const scoreEl=document.getElementById('scoreEl');
const comboEl=document.getElementById('comboEl');
const bestEl=document.getElementById('bestEl');
const livesEl=document.getElementById('livesEl');
const overlay=document.getElementById('overlay');
const oTitle=document.getElementById('oTitle');
const oBig=document.getElementById('oBig');
const oSub=document.getElementById('oSub');
const startBtn=document.getElementById('startBtn');

/* ── Game variables ── */
let best=+localStorage.getItem('tpBest')||0;
bestEl.textContent=best;

let running=false;
let score=0,combo=0,lives=3;
let cameraY=0,targetCameraY=0;
let crane={x:W/2,y:90,w:40,h:8,dir:1,speed:2.8,range:W-100};
let ropeLength=50;
let currentBlock=null; // block currently on the crane
let fallingBlock=null; // block dropping down
let towerStack=[]; // static stack of blocks
let particles=[];
let floatingTexts=[];
let shakeAmt=0;

/* Color Palettes for Neon Blocks */
const BLOCK_PALETTE=[
  {col:'#ff55bb',glow:'#ff55bbcc'}, // Pink
  {col:'#33ccff',glow:'#33ccffcc'}, // Cyan
  {col:'#33ffaa',glow:'#33ffaacc'}, // Emerald
  {col:'#ffcc44',glow:'#ffcc44cc'}, // Yellow-gold
  {col:'#ff6633',glow:'#ff6633cc'}, // Orange
  {col:'#cc55ff',glow:'#cc55ffcc'}, // Purple
];

/* Stars Background */
const BG_STARS=Array.from({length:60},()=>({
  x:Math.random()*W,
  y:Math.random()*H,
  r:0.5+Math.random()*1.2,
  bright:0.2+Math.random()*0.6
}));

function spawnParticles(x,y,col,n=12){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2;
    const v=1+Math.random()*4;
    particles.push({
      x,y,
      vx:Math.cos(a)*v,
      vy:Math.sin(a)*v-0.5,
      life:1,
      col,
      r:1.5+Math.random()*3
    });
  }
}

function addFloatingText(x,y,txt,col){
  floatingTexts.push({x,y,text:txt,col,life:1,vy:-1.2});
}

function initGame(){
  score=0;combo=0;lives=3;
  cameraY=0;targetCameraY=0;
  crane.speed=2.8;
  crane.x=W/2;
  towerStack=[];
  particles=[];
  floatingTexts=[];
  shakeAmt=0;
  fallingBlock=null;

  // Add the base block at the bottom of the stack
  const baseWidth=160;
  towerStack.push({
    x:W/2-baseWidth/2,
    y:H-45,
    w:baseWidth,
    h:36,
    col:'#223355',
    glow:'#22335588'
  });

  scoreEl.textContent=0;
  comboEl.textContent='×0';
  updateLivesDisplay();
  spawnNextBlock();
}

function spawnNextBlock(){
  const topBlock=towerStack[towerStack.length-1];
  const colorObj=BLOCK_PALETTE[score%BLOCK_PALETTE.length];
  currentBlock={
    x:crane.x,
    y:crane.y+ropeLength,
    w:topBlock.w, // matches current top block width
    h:32,
    col:colorObj.col,
    glow:colorObj.glow
  };
}

function dropBlock(){
  if(!running||fallingBlock||!currentBlock) return;
  fallingBlock={
    ...currentBlock,
    vy:0,
    gravity:0.42
  };
  currentBlock=null;
}

function updateLivesDisplay(){
  livesEl.textContent='❤️'.repeat(Math.max(0,lives)) || '💀';
}

function triggerShake(){
  shakeAmt=14;
}

function update(){
  if(!running) return;

  // Screen shake decay
  if(shakeAmt>0) shakeAmt*=0.86;

  // Move Crane Trolley
  crane.x+=crane.speed*crane.dir;
  const leftLimit=(W-crane.range)/2;
  const rightLimit=W-leftLimit;
  if(crane.x>=rightLimit){
    crane.x=rightLimit;
    crane.dir=-1;
  }else if(crane.x<=leftLimit){
    crane.x=leftLimit;
    crane.dir=1;
  }

  // Position block currently hanging from the crane
  if(currentBlock){
    currentBlock.x=crane.x-currentBlock.w/2;
    currentBlock.y=crane.y+ropeLength;
  }

  // Update Falling Block
  if(fallingBlock){
    fallingBlock.vy+=fallingBlock.gravity;
    fallingBlock.y+=fallingBlock.vy;

    // Check collision with the top of the stack
    const targetBlock=towerStack[towerStack.length-1];
    const topOfStackY=targetBlock.y-cameraY;
    const fallingBlockBottomY=fallingBlock.y+fallingBlock.h-cameraY;

    if(fallingBlockBottomY>=targetBlock.y){
      // Snap to stack y position
      fallingBlock.y=targetBlock.y-fallingBlock.h;

      // Calculate overlap
      const x1=Math.max(fallingBlock.x,targetBlock.x);
      const x2=Math.min(fallingBlock.x+fallingBlock.w,targetBlock.x+targetBlock.w);
      const overlapW=x2-x1;

      if(overlapW<=5){
        // MISS! Block falls off completely
        triggerShake();
        lives--;
        updateLivesDisplay();
        addFloatingText(fallingBlock.x+fallingBlock.w/2,fallingBlock.y-10,'MISS!', '#ff3366');
        
        // Let it fall to the bottom of the screen
        const missedBlock={...fallingBlock,vy:3,vx:(fallingBlock.x+fallingBlock.w/2<targetBlock.x+targetBlock.w/2)?-2:2};
        fallingBlock=null;
        
        // Custom falling off effect
        particles.push({
          x:missedBlock.x+missedBlock.w/2,
          y:missedBlock.y+missedBlock.h/2,
          vx:missedBlock.vx,
          vy:5,
          life:1.2,
          col:missedBlock.col,
          r:14,
          isBlock:true,
          w:missedBlock.w,
          h:missedBlock.h
        });

        if(lives<=0){
          gameOver();
          return;
        }

        spawnNextBlock();
      }else{
        // LANDED! Slice overlap
        const overhangLeft=fallingBlock.x<targetBlock.x?targetBlock.x-fallingBlock.x:0;
        const overhangRight=fallingBlock.x+fallingBlock.w>targetBlock.x+targetBlock.w?(fallingBlock.x+fallingBlock.w)-(targetBlock.x+targetBlock.w):0;

        // Slice particles
        if(overhangLeft>0){
          spawnParticles(targetBlock.x,fallingBlock.y+fallingBlock.h/2,fallingBlock.col,8);
        }
        if(overhangRight>0){
          spawnParticles(targetBlock.x+targetBlock.w,fallingBlock.y+fallingBlock.h/2,fallingBlock.col,8);
        }

        // PERFECT alignment check (within 3 pixels)
        const diff=fallingBlock.x-targetBlock.x;
        const isPerfect=Math.abs(diff)<3.5;

        let finalX=x1;
        let finalW=overlapW;

        if(isPerfect){
          combo++;
          comboEl.textContent='×'+combo;
          // Expand block slightly for recovery, up to original base size
          finalW=Math.min(160,overlapW+4);
          finalX=targetBlock.x+(overlapW-finalW)/2; // keep centered on target

          // Double combo bonus points
          score+=1;
          addFloatingText(finalX+finalW/2,fallingBlock.y-15,`PERFECT! Combo ×${combo}`, '#ffcc44');
          spawnParticles(finalX+finalW/2,fallingBlock.y+fallingBlock.h/2,'#ffcc44',16);
        }else{
          combo=0;
          comboEl.textContent='×0';
          score+=1;
          addFloatingText(finalX+finalW/2,fallingBlock.y-15,'+1', '#ff88dd');
        }

        scoreEl.textContent=score;
        if(score>best){
          best=score;
          localStorage.setItem('tpBest',best);
          bestEl.textContent=best;
        }

        // Add to stack
        towerStack.push({
          x:finalX,
          y:fallingBlock.y,
          w:finalW,
          h:fallingBlock.h,
          col:fallingBlock.col,
          glow:fallingBlock.glow
        });

        fallingBlock=null;

        // Scroll Camera if stack goes above mid-screen (250px from top)
        const stackHeightY=towerStack[towerStack.length-1].y;
        if(stackHeightY<H-240){
          targetCameraY=H-240-stackHeightY;
        }

        // Increase crane speed slightly to raise difficulty
        crane.speed=Math.min(5.5,2.8+score*0.06);

        // Spawn next block
        spawnNextBlock();
      }
    }
  }

  // Smooth Camera Scrolling
  cameraY+=(targetCameraY-cameraY)*0.1;

  // Update Particles
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    if(p.isBlock){
      p.x+=p.vx;p.y+=p.vy;p.vy+=0.3;p.life-=0.02;
    }else{
      p.x+=p.vx;p.y+=p.vy;p.vy+=0.05;p.life-=0.035;
    }
    if(p.life<=0) particles.splice(i,1);
  }

  // Update Floating Texts
  for(let i=floatingTexts.length-1;i>=0;i--){
    const f=floatingTexts[i];
    f.y+=f.vy;f.life-=0.025;
    if(f.life<=0) floatingTexts.splice(i,1);
  }
}

function draw(){
  ctx.save();
  
  // Apply Screen Shake
  if(shakeAmt>0){
    const dx=(Math.random()-0.5)*shakeAmt;
    const dy=(Math.random()-0.5)*shakeAmt;
    ctx.translate(dx,dy);
  }

  // Clear background
  ctx.fillStyle='#02050a';ctx.fillRect(0,0,W,H);

  // Parallax stars
  ctx.fillStyle='#fff';
  BG_STARS.forEach((s,idx)=>{
    ctx.save();
    // Parallax scrolling: stars scroll slower than camera
    const sy=(s.y+cameraY*0.25)%H;
    ctx.globalAlpha=s.bright*(0.6+0.4*Math.sin(performance.now()*0.001+idx));
    ctx.beginPath();ctx.arc(s.x,sy,s.r,0,Math.PI*2);ctx.fill();
    ctx.restore();
  });

  // Glowing city skyline at the very bottom (moves down with camera)
  ctx.save();
  ctx.fillStyle='rgba(13,24,48,0.36)';
  ctx.shadowColor='rgba(13,24,48,0.2)';
  ctx.shadowBlur=30;
  const skylineY=H-30+cameraY*0.6;
  if(skylineY<H+80){
    ctx.beginPath();
    ctx.moveTo(0,H);
    ctx.lineTo(0,skylineY-30);
    ctx.lineTo(40,skylineY-30);
    ctx.lineTo(40,skylineY-60);
    ctx.lineTo(80,skylineY-60);
    ctx.lineTo(80,skylineY-10);
    ctx.lineTo(130,skylineY-15);
    ctx.lineTo(130,skylineY-80);
    ctx.lineTo(170,skylineY-80);
    ctx.lineTo(170,skylineY-30);
    ctx.lineTo(220,skylineY-45);
    ctx.lineTo(220,skylineY-100);
    ctx.lineTo(260,skylineY-100);
    ctx.lineTo(260,skylineY-20);
    ctx.lineTo(320,skylineY-50);
    ctx.lineTo(320,skylineY-70);
    ctx.lineTo(360,skylineY-70);
    ctx.lineTo(360,skylineY-30);
    ctx.lineTo(400,skylineY-40);
    ctx.lineTo(400,skylineY-90);
    ctx.lineTo(W,skylineY-90);
    ctx.lineTo(W,H);
    ctx.closePath();ctx.fill();
  }
  ctx.restore();

  // Grid Lines in background
  ctx.strokeStyle='rgba(51,204,255,0.02)';ctx.lineWidth=1;
  for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  const gridOffsetY=cameraY%40;
  for(let y=0;y<H+40;y+=40){ctx.beginPath();ctx.moveTo(0,y+gridOffsetY);ctx.lineTo(W,y+gridOffsetY);ctx.stroke();}

  // Draw Static Stack of Tower Blocks
  towerStack.forEach(b=>{
    const yOnScreen=b.y+cameraY;
    if(yOnScreen+b.h>=0&&yOnScreen<=H){
      ctx.save();
      ctx.shadowColor=b.col;
      ctx.shadowBlur=16;
      ctx.fillStyle=b.col;
      
      // Draw main block
      ctx.beginPath();ctx.roundRect(b.x,yOnScreen,b.w,b.h,5);ctx.fill();
      
      // Draw neon border outline
      ctx.strokeStyle='rgba(255,255,255,0.2)';
      ctx.lineWidth=1;
      ctx.beginPath();ctx.roundRect(b.x,yOnScreen,b.w,b.h,5);ctx.stroke();

      // Top Highlight shine
      ctx.fillStyle='rgba(255,255,255,0.15)';
      ctx.fillRect(b.x+4,yOnScreen+3,b.w-8,3);
      ctx.restore();
    }
  });

  // Draw Falling Block
  if(fallingBlock){
    const yOnScreen=fallingBlock.y+cameraY;
    ctx.save();
    ctx.shadowColor=fallingBlock.col;
    ctx.shadowBlur=20;
    ctx.fillStyle=fallingBlock.col;
    ctx.beginPath();ctx.roundRect(fallingBlock.x,yOnScreen,fallingBlock.w,fallingBlock.h,5);ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.3)';
    ctx.lineWidth=1.5;
    ctx.beginPath();ctx.roundRect(fallingBlock.x,yOnScreen,fallingBlock.w,fallingBlock.h,5);ctx.stroke();
    ctx.restore();
  }

  // Draw Crane
  ctx.save();
  // Horizontal track at the top
  ctx.strokeStyle='#1a2f52';ctx.lineWidth=4;
  ctx.beginPath();ctx.moveTo(0,crane.y);ctx.lineTo(W,crane.y);ctx.stroke();
  
  // Trolley
  ctx.fillStyle='#3377dd';
  ctx.beginPath();ctx.roundRect(crane.x-22,crane.y-6,44,12,4);ctx.fill();
  ctx.strokeStyle='#fff';ctx.lineWidth=1;
  ctx.beginPath();ctx.roundRect(crane.x-22,crane.y-6,44,12,4);ctx.stroke();

  // Rope/Cable
  ctx.strokeStyle='rgba(255,255,255,0.4)';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(crane.x,crane.y+6);ctx.lineTo(crane.x,crane.y+ropeLength);ctx.stroke();
  
  // Hook/Base
  ctx.fillStyle='#3377dd';
  ctx.beginPath();ctx.arc(crane.x,crane.y+ropeLength,4,0,Math.PI*2);ctx.fill();
  ctx.restore();

  // Draw Hanging Block (Current Block)
  if(currentBlock){
    ctx.save();
    ctx.shadowColor=currentBlock.col;
    ctx.shadowBlur=18;
    ctx.fillStyle=currentBlock.col;
    ctx.beginPath();ctx.roundRect(currentBlock.x,currentBlock.y,currentBlock.w,currentBlock.h,5);ctx.fill();
    ctx.restore();
  }

  // Draw Particles
  particles.forEach(p=>{
    ctx.save();ctx.globalAlpha=p.life;
    ctx.fillStyle=p.col;
    if(p.isBlock){
      ctx.shadowBlur=10;ctx.shadowColor=p.col;
      ctx.beginPath();ctx.roundRect(p.x,p.y+cameraY,p.w,p.h,2);ctx.fill();
    }else{
      ctx.shadowBlur=12;ctx.shadowColor=p.col;
      ctx.beginPath();ctx.arc(p.x,p.y+cameraY,p.r*p.life,0,Math.PI*2);ctx.fill();
    }
    ctx.restore();
  });

  // Draw Floating Texts
  floatTextsDraw();

  ctx.restore();
}

function floatTextsDraw(){
  floatingTexts.forEach(f=>{
    ctx.save();ctx.globalAlpha=f.life;
    ctx.fillStyle=f.col;
    ctx.shadowBlur=8;ctx.shadowColor=f.col;
    ctx.font=`bold 16px Outfit`;
    ctx.textAlign='center';
    ctx.fillText(f.text,f.x,f.y+cameraY);
    ctx.restore();
  });
}

function gameLoop(){
  update();
  draw();
  if(running) requestAnimationFrame(gameLoop);
}

function startGame(){
  initGame();
  running=true;
  overlay.classList.add('hidden');
  requestAnimationFrame(gameLoop);
}

function gameOver(){
  running=false;
  const grade=score>=35?'S (Architect)':score>=25?'A (Master)':score>=15?'B (Builder)':score>=8?'C (Novice)':'D (Unstable)';
  oTitle.textContent='TOWER COLLAPSED!';
  oBig.textContent=score;oBig.style.display='block';
  oSub.innerHTML=`Grade: <strong style="color:#ffcc44;font-size:1.15rem">${grade}</strong><br>
    Final Floor Count: ${score}<br>
    Best Height: ${best} floors<br>
    ${score>=best?'🏆 New Tower Record!':''}`;
  startBtn.textContent='↺ TRY AGAIN';
  overlay.classList.remove('hidden');
}

/* Event Listeners */
startBtn.addEventListener('click',startGame);

// Trigger block drop on canvas click or Spacebar
c.addEventListener('mousedown',e=>{
  if(e.button===0) dropBlock();
});
c.addEventListener('touchstart',e=>{
  dropBlock();
  e.preventDefault();
}, {passive:false});

window.addEventListener('keydown',e=>{
  if(e.code==='Space'){
    dropBlock();
    e.preventDefault();
  }
});
</script>
</body>
</html>
